# Its own workspace, deliberately: this crate only ever builds for
# riscv32im-risc0-zkvm-elf, so it must not be pulled into the host workspace's
# build graph.
[workspace]

[package]
name = "lez-hello-world-guest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.0-rc1" }

# Required at link time by the guest entry point, though nothing here names it.
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }

[package.metadata.cargo-machete]
ignored = ["risc0-zkvm"]
