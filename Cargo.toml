[package]
name = "lez-rfp021-experiment"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An Ethereum light client and state attestation on the Logos Execution Zone"

# LEZ crates, pinned to the tag this was verified against. Upstream publishes
# versions as git tags and offers no backward compatibility yet, so a floating
# branch would break without warning.
#
# To develop against a local checkout instead, uncomment the patch block below.
[dependencies]
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1", features = ["client"] }

# The light-client program's messages, state and checks (crates/types), and Helios's types, which
# the client decodes Beacon API JSON into.
eth-lc-types = { path = "crates/types", features = ["helios"] }
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8" }
serde_json = "1"
alloy-primitives = "1.7"

anyhow = "1.0.98"
borsh = "1.5.7"
risc0-binfmt = "3.0"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "time"] }

# [patch."https://github.com/logos-blockchain/logos-execution-zone.git"]
# lee = { path = "../logos-execution-zone/lee/state_machine" }
# wallet = { path = "../logos-execution-zone/lez/wallet" }
# program_loader_core = { path = "../logos-execution-zone/lez/programs/program_loader/core" }
# common = { path = "../logos-execution-zone/lez/common" }
# sequencer_service_rpc = { path = "../logos-execution-zone/lez/sequencer/service/rpc" }

[dev-dependencies]
# The adversarial tests sign a fabricated chain with keys they hold, and recompute its SSZ roots.
bls12_381 = { version = "0.8", features = ["experimental"] }
sha2_09 = { package = "sha2", version = "0.9" }
tree_hash = "0.10"
# The receipt-log test builds a receipt-trie proof the way an execution node would.
alloy-rlp = "0.3"
alloy-trie = "0.9"
# Runs the program in the executor, metered as the sequencer meters it.
risc0-zkvm = { version = "=3.0.5", features = ["client"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
